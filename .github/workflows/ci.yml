name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# A CI só lê o código; não precisa de permissão de escrita.
permissions:
  contents: read

# Cada checagem é um job separado: rodam em paralelo e, quando uma falha, o nome do check
# já diz qual foi. Os nomes (lint, typecheck, test, build, banco) são os que a proteção da
# branch dev exige; se mudar um nome, avise o dono do repositório.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

  banco:
    name: banco
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Banco descartável só para validar as migrations, com a mesma extensão PostGIS do Neon.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: db/package-lock.json
      - name: Migrations (simula, aplica, reverte tudo e aplica de novo)
        working-directory: db
        env:
          DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          npm ci
          npm run migrar:simular
          npm run migrar
          while node migrar.mjs status | grep '^aplicada' > /dev/null; do npm run migrar:reverter; done
          npm run migrar
      - name: Testes de banco (constraints, políticas de RLS e cenários de uso)
        working-directory: db
        env:
          DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run teste:banco
